name: event_management_app
description: University Event Management App

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (LATEST COMPATIBLE)
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Gemini AI
  google_generative_ai: ^0.4.7

  # UI
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2

  # Calendar (YOUR FEATURE)
  table_calendar: ^3.0.9
  http: ^1.6.0
  gal: ^2.3.2
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  iconsax: ^0.0.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  #paypal
  flutter_paypal: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env